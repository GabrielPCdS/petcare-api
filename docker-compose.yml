services:
  db:
    image: postgres:16-alpine
    container_name: petcare-db
    environment:
      POSTGRES_DB: petcare
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare_dev
    ports:
      - "5432:5432"
    volumes:
      - petcare-dados:/var/lib/postgresql/data

volumes:
  petcare-dados: